name: CD Fake
on: 
    workflow_dispatch: 
        inputs:
            ambiente:
                type:
                options:
                    - homologacao
                    - producao
jobs:
    deploy-fake:
        runs-on: ubuntu-latest
        environment: ${{ inputs.ambiente }}"
        steps:
            - name: Fake de deploy em ambiente
              run: echo "Deploy no ambiente de ${{ vars.AMBIENTE_DEPLOY }}"
    teste-fake:
        runs-on: ubuntu-latest
        environment: ${{ inputs.ambiente }}"
        needs: [deploy-fake-homolog]
        steps:
            - name: Fake de teste em ambiente
              run: echo "Teste no deploy no ambiente de ${{ vars.AMBIENTE_DEPLOY }}"
     deploy-fake-producao:
        runs-on: ubuntu-latest
        environment: producao
        needs: [teste-fake]
        steps:
            - name: Fake de teste em ambiente
              run: echo "Teste no deploy no ambiente de ${{ vars.AMBIENTE_DEPLOY }}"
